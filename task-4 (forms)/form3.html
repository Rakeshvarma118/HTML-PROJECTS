<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form 3</title>
</head>
<body>
    <form >
        <h2>HTML Form</h2>
        <table cellpadding="5" cellspacing="5">
            <tr>
                <td><label for="1">First Name  :</label></td>
                <td colspan="2"><input type="text" id="1" name="fname"></td>
            </tr>
            <tr>
                <td><label for="2">Last Name  :</label></td>
                <td colspan="2"><input type="text" id="2" name="lname"></td>
            </tr>
            <tr>
                <td><label for="3">Date of Birth :</label></td>
                <td colspan="2"><input type="date" id="3" name="dob"></td>
            </tr>
            <tr>
                <td><label for="4">Email Id      :</label></td>
                <td colspan="2"><input type="email" id="4" name="mail"></td>
            </tr>
            <tr>
                <td><label for="5">Mobile Number :</label></td>
                <td colspan="2"><input type="tel" id="5" name="phn"></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="SUBMIT"></td>
                <td><input type="reset" value="RESET"></td>
            </tr>
        </table>
    </form>
</body>
</html>
