<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form 1</title>
</head>
<body>
    <form>
        <table align="center">
            <caption><h3><u>Registration Form</u></h3></caption>
            <tr>
                <td><label for="f1">First Name</label></td>
                <td></td>
                <td> </td>
                <td colspan="3"><input type="text" id="f1" name="fname"></td>
            </tr>
            <tr>
                <td><label for="f2">Last Name</label></td>
                <td></td>
                <td> </td>
                <td colspan="3"><input type="text" id="f2" name="lname"></td>
            </tr>
            <tr>
                <td><label for="f3">Nick Name</label></td>
                <td></td>
                <td> </td>
                <td colspan="3"><input type="text" id="f3" name="nname"></td>
            </tr>
            <tr>
                <td><label for="f4">E-mail</label></td>
                <td></td>
                <td> </td>
                <td colspan="3"><input type="email" id="f4" name="mail"></td>
            </tr>
            <tr>
                <td><label for="f5">Password</label></td>
                <td></td>
                <td> </td>
                <td colspan="3"><input type="password" id="f5" name="password"></td>
            </tr>
            <tr>
                <td><label for="f6">Date of Birth</label></td>
                <td></td>
                <td> </td>
                <td colspan="3"><input type="date" id="f6" name="dob"></td>
            </tr>
            <tr>
                <td><label>Gender</label></td>
                <td></td>
                <td> </td>
                <td><input type="radio" name="gender">Male</td>
                <td><input type="radio" name="gender">Female</td>
                <td><input type="radio" name="gender">Others</td>
            </tr>
            <tr>
                <td><label for="f7">Mobile</label></td>
                <td></td>
                <td> </td>
                <td colspan="3"><input type="tel" id="f7" name="phn"></td>
            </tr>
            <tr>
                <td><label for="f8">Address</label></td>
                <td></td>
                <td> </td>
                <td colspan="3"><textarea name="addr" id="f8"></textarea></td>
            </tr>
            <tr>
                <td colspan="2"></td>
                <td ><input type="submit" value="Submit"></td>
                <td colspan="2"></td>
                <td><input type="reset" value="Reset"></td>
            </tr>
        </table>
    </form>

</body>
</html>
